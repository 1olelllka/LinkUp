spring:
  application:
    name: image-storage
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    metadata-map:
      version: v0.9
      region: eu-central
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

spring.cloud:
  compatibility-verifier:
    enabled: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info
