# Global Docker Compose File
name: LinkUp_Backend
services:
  profile_db:
    container_name: profile_neo4j
    image: neo4j:5.26.0
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/neo4j-admin}
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - "neo4j_data:/data"
  rabbitmq:
    container_name: linkup_rabbimtq
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-secret}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-myuser}
    networks:
      - linkup-net
  global_cache:
    container_name: redis_global_cache
    image: redis:7.2.6
    ports:
      - 6379:6379
    volumes:
      - "redis_data:/data"
  global_mongo:
    container_name: mongo_global_db
    image: mongo:8.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-admin}
    volumes:
      - "mongo_data:/data/db"

volumes:
  elasticsearch_data:
  redis_data:
  mongo_data:
  neo4j_data:

networks:
  linkup-net:
     external: true
